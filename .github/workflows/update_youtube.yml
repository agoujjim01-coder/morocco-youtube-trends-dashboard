name: Weekly Morocco YouTube Update

on:
  workflow_dispatch:
  
    inputs:
      test_only:
        description: "Check Python syntax without updating data"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python --version
          which python
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn langdetect google-api-python-client google-generativeai yt-dlp openai-whisper
          python -c "import pandas; print('Pandas installed:', pandas.__version__)"
      - name: Check Python syntax
        run: |
          python -m compileall -q weekly_update.py scripts utils app.py
          echo "Python syntax check passed"
      - name: Run weekly YouTube update
        if: ${{ github.event_name == 'schedule' || inputs.test_only == false }}
        run: |
          python -u weekly_update.py
      - name: Commit updated dashboard data
        if: ${{ github.event_name == 'schedule' || inputs.test_only == false }}
        run: |
          git config user.name "morocco-trends-bot"
          git config user.email "actions@github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Automatic weekly YouTube trends update"
            git push
          fi
