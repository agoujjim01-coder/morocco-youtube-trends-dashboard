name: Weekly Morocco YouTube Update

on:
  schedule:
    - cron: "0 7 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
            python -m pip install --upgrade pip
            python -m pip install pandas numpy
            python -m pip install scikit-learn langdetect
            python -m pip install google-api-python-client
            python -m pip install google-generativeai
            python -m pip install yt-dlp
            python -m pip install openai-whisper
              - name: Run weekly YouTube update
                run: |
                  python weekly_update.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "morocco-trends-bot"
          git config user.email "actions@github.com"
          git add data/

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Automatic weekly YouTube trends update"
            git push
          fi
